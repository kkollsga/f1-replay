<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Viewer - {{ race.event_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <canvas id="trackCanvas"></canvas>

    <!-- Track Header (above track) -->
    <div id="trackHeader" class="track-header">
        <div class="track-selector">
            <span class="year-selector" id="yearSelector">2024</span>
            <span class="track-name-selector" id="trackNameSelector">Loading...</span>
        </div>
        <div class="track-actions" id="trackActions">
            <button class="track-btn cancel-btn" id="cancelBtn">Cancel</button>
            <button class="track-btn load-btn" id="loadBtn">Load</button>
        </div>
    </div>

    <!-- Weather Indicator (below track header) -->
    <div id="weatherIndicator" class="weather-indicator hidden">
        <span class="rain-icon">🌧️</span>
        <span class="rain-text">Rain</span>
    </div>

    <!-- Year Dropdown -->
    <div class="selector-dropdown" id="yearDropdown">
        <!-- Years will be populated by JavaScript -->
    </div>

    <!-- Track Dropdown -->
    <div class="selector-dropdown" id="trackDropdown">
        <!-- Tracks will be populated by JavaScript -->
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="header-row">
                <button class="play-pause-btn" id="playPauseBtn" title="Play/Pause">
                    <span class="play-icon">▶</span>
                    <span class="pause-icon">❚❚</span>
                </button>
                <div class="speed-selector" id="speedSelector">
                    <span class="speed-value">1x</span>
                    <div class="speed-dropdown" id="speedDropdown">
                        <div class="speed-option" data-speed="0.25">0.25x</div>
                        <div class="speed-option" data-speed="0.5">0.5x</div>
                        <div class="speed-option selected" data-speed="1">1x</div>
                        <div class="speed-option" data-speed="2">2x</div>
                        <div class="speed-option" data-speed="5">5x</div>
                        <div class="speed-option" data-speed="10">10x</div>
                        <div class="speed-option" data-speed="20">20x</div>
                        <div class="speed-option" data-speed="50">50x</div>
                    </div>
                </div>
                <div class="race-timer" id="raceTimer">00:00:00</div>
                <div class="lap-counter" id="lapCounter">Lap 1 / 57</div>
            </div>
        </div>

        <div class="standings-container">
            <div class="standings-title">Live Standings</div>
            <div id="standings">
                <!-- Standings will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Race Control Messages (lower right) -->
    <div id="raceMessages" class="race-messages">
        <!-- Messages will be dynamically added here -->
    </div>

    <script src="{{ url_for('static', filename='js/track.js') }}"></script>
</body>
</html>
