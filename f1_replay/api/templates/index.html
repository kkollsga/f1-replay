<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <!-- Left Sidebar (Standings) -->
    <div id="sidebar">
        <div class="standings-wrapper">
            <div class="standings-card">
                <!-- Card Header: Controls and Race Info -->
                <div class="standings-header">
                    <!-- Row 1: Race Timer -->
                    <div class="race-timer" id="raceTimer">00:00:00</div>
                    <!-- Row 2: Speed Selector + Play/Pause Button + Lap Counter -->
                    <div class="standings-controls-row">
                        <div class="standings-controls">
                            <div class="speed-selector" id="speedSelector">
                                <span class="speed-value" id="speedValue">1x</span>
                                <div class="speed-dropdown">
                                    <div class="speed-option" data-speed="0.25">0.25x</div>
                                    <div class="speed-option" data-speed="0.5">0.5x</div>
                                    <div class="speed-option selected" data-speed="1">1x</div>
                                    <div class="speed-option" data-speed="2">2x</div>
                                    <div class="speed-option" data-speed="5">5x</div>
                                    <div class="speed-option" data-speed="10">10x</div>
                                    <div class="speed-option" data-speed="20">20x</div>
                                    <div class="speed-option" data-speed="50">50x</div>
                                </div>
                            </div>
                            <button class="play-pause-btn" id="playPauseBtn">&#9654;</button>
                        </div>
                        <div class="lap-counter" id="lapCounter">Lap 1 / 57</div>
                        <div class="sidebar-tab-toggle" id="sidebarTabToggle" style="display: none;">
                            <button class="sidebar-tab-btn active" data-tab="standings">Pos</button>
                            <button class="sidebar-tab-btn" data-tab="strategy">Strat</button>
                        </div>
                    </div>
                </div>

                <!-- Card Body: Live Standings List -->
                <div class="standings-body" id="standingsBody">
                    <div id="standings">
                        <!-- Standings will be populated by JavaScript -->
                    </div>
                    <div id="strategyPanel" class="strategy-panel" style="display: none;">
                        <!-- Strategy bars populated by JavaScript -->
                    </div>
                </div>

                <!-- Card Footer: Export -->
                <div class="standings-footer" id="standingsFooter">
                    <button class="export-btn" id="exportCsvBtn" title="Export session data as CSV">CSV</button>
                    <button class="export-btn" id="exportJsonBtn" title="Export session data as JSON">JSON</button>
                </div>
            </div>

            <!-- Fastest Lap Indicators Overlay (sibling to card for proper overflow) -->
            <div class="fastest-lap-indicators-overlay" id="fastestLapIndicatorsOverlay">
                <!-- Indicators will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Center Body (Track, Controls) -->
    <div class="body-container">
        <!-- Header: Race Status / Event Notifications -->
        <div class="body-header">
            <div id="eventNotifications" class="event-notifications">
                <div id="redFlagPill" class="event-pill red-flag hidden">Red Flag</div>
                <div id="safetyCarPill" class="event-pill safety-car hidden">Safety Car</div>
                <div id="vscPill" class="event-pill vsc hidden">Virtual Safety Car</div>
                <div id="rainPill" class="event-pill rain hidden">Rain</div>
                <div id="formationLapPill" class="event-pill formation-lap hidden">Formation Lap</div>
                <div id="statusSubtitle" class="status-subtitle hidden"></div>
            </div>
            <div id="startingLights" class="starting-lights">
                <svg width="380" height="70" viewBox="0 0 380 70">
                    <rect x="2" y="2" width="376" height="66" rx="22" ry="22"
                          fill="rgba(30,30,30,0.95)" stroke="#444" stroke-width="2"/>
                    <circle id="startLight1" cx="50" cy="35" r="25" fill="#1a1a1a"/>
                    <circle id="startLight2" cx="120" cy="35" r="25" fill="#1a1a1a"/>
                    <circle id="startLight3" cx="190" cy="35" r="25" fill="#1a1a1a"/>
                    <circle id="startLight4" cx="260" cy="35" r="25" fill="#1a1a1a"/>
                    <circle id="startLight5" cx="330" cy="35" r="25" fill="#1a1a1a"/>
                </svg>
            </div>
        </div>

        <!-- Main: Track Canvas -->
        <div class="body-main">
            <canvas id="trackCanvas"></canvas>
            <canvas id="rainCanvas"></canvas>
            <div id="zoomIndicator" class="zoom-indicator">100%</div>
            <div id="lapChartOverlay" class="lap-chart-overlay">
                <div class="lap-chart-header">
                    <span class="lap-chart-title">Lap Times</span>
                    <button class="lap-chart-close" id="lapChartClose">&#10005;</button>
                </div>
                <canvas id="lapChart" width="320" height="180"></canvas>
            </div>
        </div>

        <!-- Footer: Race Selector / Follow Mode -->
        <div class="body-footer">
            <!-- Default: Year/Event Selector -->
            <div class="selector-controls" id="selectorControls">
                <select id="yearSelector"></select>
                <select id="eventSelector"></select>
                <div class="session-tabs" id="sessionTabs"></div>
                <div class="selector-controls-actions">
                    <button class="action-btn cancel" id="cancelBtn">Cancel</button>
                    <button class="action-btn load" id="loadBtn">Load</button>
                </div>
                <div class="loading-status" id="loadingStatus"></div>
            </div>

            <!-- Follow Mode: Driver Navigation + Zoom -->
            <div class="follow-mode-panel" id="followModePanel">
                <div class="follow-header">
                    <div class="follow-title">Chase Menu</div>
                    <button class="close-chase-btn" id="closeChaseBtn">&#10005;</button>
                </div>
                <div class="follow-controls">
                    <div class="follow-driver-section">
                        <div class="follow-driver-info">
                            <div class="follow-driver-position" id="followDriverPosition">1.</div>
                            <div class="follow-driver-name" id="followDriverName">VERSTAPPEN</div>
                            <div class="follow-driver-number" id="followDriverNumber">#1</div>
                        </div>
                        <div class="driver-nav-buttons">
                            <button class="follow-btn next" id="nextDriverBtn">↑</button>
                            <button class="follow-btn prev" id="prevDriverBtn">↓</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Race Progress Bar with Scrubbing -->
        <div class="race-progress-bar" id="raceProgressBar">
            <div class="race-progress-track" id="raceProgressTrack">
                <div class="race-progress-fill" id="raceProgressFill"></div>
                <div class="race-progress-knob" id="raceProgressKnob"></div>
            </div>
        </div>
    </div>

    <!-- Right Message Center (Race Control Messages) -->
    <div class="message-center" id="messageCenter">
        <div class="messages-container">
            <div id="raceMessages" class="race-messages"></div>
        </div>
    </div>

    <!-- Mobile Toggle Buttons (visible on smaller screens) -->
    <div class="mobile-toggles" id="mobileToggles">
        <button class="mobile-toggle-btn" id="toggleStandings">Standings</button>
        <button class="mobile-toggle-btn" id="toggleMessages">Messages</button>
    </div>

    <!-- JavaScript: Constants and Configuration -->
    <script src="{{ url_for('static', filename='js/constants.js') }}"></script>
    <!-- JavaScript: Status Manager Classes -->
    <script src="{{ url_for('static', filename='js/status-managers.js') }}"></script>
    <!-- JavaScript: Session-specific variables (Jinja-templated) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const YEAR = {% if year %}{{ year }}{% else %}null{% endif %} || parseInt(urlParams.get('year')) || 2024;
        const ROUND = {% if round %}{{ round }}{% else %}null{% endif %} || parseInt(urlParams.get('round')) || 24;
        let SESSION_TYPE = urlParams.get('session') || 'R';
    </script>
    <!-- JavaScript: Main Viewer -->
    <script src="{{ url_for('static', filename='js/viewer.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new F1RaceViewer();
        });
    </script>
</body>
</html>
